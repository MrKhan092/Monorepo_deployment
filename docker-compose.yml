version: "3.8"

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ${DOCKERHUB_USERNAME}/todo-app-backend:${IMAGE_TAG}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/mydb?schema=public"
    depends_on:
      - postgres

  websocket:
    image: ${DOCKERHUB_USERNAME}/todo-app-websocket:${IMAGE_TAG}
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/mydb?schema=public"
    depends_on:
      - postgres

  web:
    image: ${DOCKERHUB_USERNAME}/todo-app-frontend:${IMAGE_TAG}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata: