## Build docker image
## Push the docker image to docker hub
## Step to deploy this to a VM

name: Deploy the websocket
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/DockerFile.ws
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-websocket:${{ github.sha }}
      ## Step to deploy this to a VM
      - name: Deploy to the VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/ssh_key \
            ubuntu@${{ secrets.VM_HOST }} \
            "cd ~/todo-app && docker compose pull websocket && docker compose up -d websocket"